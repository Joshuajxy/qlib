qlib_init:
    provider_uri: "~/.qlib/qlib_data/crypto_data"
    region: crypto
market: &market crypto
benchmark: &benchmark bitcoin  # Using Bitcoin as benchmark
data_handler_config: &data_handler_config
    start_time: 2018-01-01
    end_time: 2021-12-31
    fit_start_time: 2018-01-01
    fit_end_time: 2020-12-31
    instruments: *market
    infer_processors: []
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10  # For crypto, smaller number of positions
            n_drop: 2  # Drop fewer positions
    backtest:
        start_time: 2021-01-01
        end_time: 2021-12-31
        account: 1000000  # 1M in crypto context
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null  # No limit thresholds for 24/7 crypto markets
            deal_price: close
            open_cost: 0.001  # Different costs for crypto
            close_cost: 0.001
            min_cost: 0.1  # Lower minimum cost for crypto
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.0421
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha360
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2018-01-01, 2020-12-31]
                valid: [2021-01-01, 2021-06-30]
                test: [2021-07-01, 2021-12-31]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 365  # 365 days per year for 24/7 crypto market
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config